<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieHub — Prototype</title>
<style>
:root{--bg:#090a0f;--panel:#11131b;--panel2:#171a24;--text:#f7f7fa;--muted:#9a9eac;--accent:#e5095a;--line:#242733}
*{box-sizing:border-box} body{margin:0;background:#05060a;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit} button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#090a0f,#08090d);padding-bottom:78px}
header{position:sticky;top:0;z-index:5;padding:18px 18px 12px;background:rgba(9,10,15,.88);backdrop-filter:blur(16px)}
.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900;letter-spacing:-.8px}.logo span{color:var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff4b91,#6d43ff);display:grid;place-items:center;font-weight:800}
main{padding:0 16px}.hero{margin:10px 0 22px;border-radius:22px;min-height:410px;padding:26px 20px;display:flex;align-items:end;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.9) 100%),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=80') center/cover;box-shadow:0 15px 50px #0008}
.hero h1{font-size:35px;line-height:1;margin:8px 0}.meta{color:#d6d7df;font-size:13px}.desc{color:#c3c5ce;font-size:13px;line-height:1.45;max-width:420px}.actions{display:flex;gap:9px;margin-top:15px}.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:800}.primary{background:#fff;color:#08090d}.secondary{background:#ffffff18;color:#fff;border:1px solid #ffffff20}
section{margin:25px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}.see{font-size:12px;color:#ff6ba5;background:none;border:0}
.row{display:flex;gap:12px;overflow:auto;padding-bottom:5px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.card{flex:0 0 125px}.poster{height:180px;border-radius:13px;object-fit:cover;width:125px;background:#1a1c25;display:block}.title{font-size:13px;font-weight:700;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rating{font-size:11px;color:#ffc95c;margin-top:3px}
.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#cfd1da;padding:8px 13px;border-radius:999px;font-size:12px}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.searchbox{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:14px;margin:14px 0}.searchbox input{width:100%;border:0;outline:0;background:none;color:#fff}.searchbox span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.grid .card{min-width:0}.grid .poster{width:100%;height:245px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:rgba(15,16,23,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:10}.navbtn{background:none;border:0;color:#777b89;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.navbtn b{font-size:20px}.navbtn.active{color:#fff}.navbtn.active b{color:var(--accent)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#10121a;border-radius:24px 24px 0 0;padding:20px}.close{float:right;border:0;background:#ffffff12;color:#fff;border-radius:50%;width:34px;height:34px}.detailposter{width:130px;height:190px;object-fit:cover;border-radius:14px;float:left;margin:0 16px 10px 0}.detail h2{margin:4px 0 7px;font-size:25px}.detail p{color:#b9bbc5;line-height:1.55;font-size:13px}.clear{clear:both}
@media(min-width:700px){body{background:#020307}.app{box-shadow:0 0 80px #000}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="logo">Movie<span>Hub</span></div><div class="avatar">M</div></div></header>
<main id="content"></main>
<nav>
<button class="navbtn active" data-page="home"><b>⌂</b>Home</button>
<button class="navbtn" data-page="search"><b>⌕</b>Search</button>
<button class="navbtn" data-page="genres"><b>◈</b>Genres</button>
<button class="navbtn" data-page="watchlist"><b>♡</b>Watchlist</button>
</nav>
</div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="detail"></div></div></div>
<script>
const API = "https://moviehub-api.imessad-lyndadcot.workers.dev";

let movies = [];
let watch = JSON.parse(localStorage.getItem("moviehub-watch") || "[]");
let current = "home";

const $ = s => document.querySelector(s);

function normalizeMovie(m) {
  return {
    id: m.id,
    t: m.title || m.original_title || "Untitled",
    g: genreName(m.genre_ids?.[0]),
    r: Number(m.vote_average || 0).toFixed(1),
    img: m.poster_path
      ? `https://image.tmdb.org/t/p/w500${m.poster_path}`
      : "https://via.placeholder.com/500x750?text=No+Poster",
    backdrop: m.backdrop_path
      ? `https://image.tmdb.org/t/p/w1280${m.backdrop_path}`
      : "",
    d: m.overview || "No description available.",
    release: m.release_date || ""
  };
}

function genreName(id) {
  const map = {
    28:"Action",
    12:"Adventure",
    16:"Animation",
    35:"Comedy",
    80:"Crime",
    99:"Documentary",
    18:"Drama",
    10751:"Family",
    14:"Fantasy",
    36:"History",
    27:"Horror",
    10402:"Music",
    9648:"Mystery",
    10749:"Romance",
    878:"Sci-Fi",
    10770:"TV Movie",
    53:"Thriller",
    10752:"War",
    37:"Western"
  };

  return map[id] || "Movie";
}

function card(m) {
  return `
    <div class="card" onclick="openMovie(${m.id})">
      <img class="poster" src="${m.img}" loading="lazy">
      <div class="title">${m.t}</div>
      <div class="rating">★ ${m.r}</div>
    </div>
  `;
}

async function loadMovies() {
  try {
    $("#content").innerHTML = `
      <div class="empty">Loading movies...</div>
    `;

    const response = await fetch(`${API}/trending`);

    if (!response.ok) {
      throw new Error("API request failed");
    }

    const data = await response.json();

    movies = (data.results || [])
      .filter(m => m.media_type === "movie" || !m.media_type)
      .map(normalizeMovie);

    if (!movies.length) {
      throw new Error("No movies returned");
    }

    renderHome();

  } catch (error) {
    console.error(error);

    $("#content").innerHTML = `
      <div class="empty">
        <h3>Unable to load movies</h3>
        <p>Please try again later.</p>
      </div>
    `;
  }
}

function renderHome() {
  const trending = movies.slice(0, 10);
  const popular = [...movies]
    .sort((a, b) => Number(b.r) - Number(a.r))
    .slice(0, 10);

  const featured = movies[0];

  $("#content").innerHTML = `
    <div class="hero"
      style="
        background-image:
        linear-gradient(180deg,transparent 25%,rgba(0,0,0,.9) 100%),
        url('${featured.backdrop || featured.img}');
      ">
      <div>
        <div class="meta">FEATURED • ${featured.release?.slice(0,4) || "2026"}</div>

        <h1>${featured.t}</h1>

        <div class="meta">
          ${featured.g} · ★ ${featured.r}
        </div>

        <p class="desc">${featured.d}</p>

        <div class="actions">
          <button class="btn primary"
            onclick="openMovie(${featured.id})">
            ▶ View movie
          </button>

          <button class="btn secondary"
            onclick="toggleWatch(${featured.id})">
            ♡ My list
          </button>
        </div>
      </div>
    </div>

    <section>
      <div class="section-head">
        <h2>Trending now</h2>
        <button class="see" onclick="page('search')">
          See all
        </button>
      </div>

      <div class="row">
        ${trending.map(card).join("")}
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>Popular</h2>
      </div>

      <div class="row">
        ${popular.map(card).join("")}
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>Browse genres</h2>
      </div>

      <div class="chips">
        ${genres().map(g =>
          `<button class="chip" onclick="genre('${g}')">${g}</button>`
        ).join("")}
      </div>
    </section>
  `;
}

function genres() {
  return [...new Set(movies.map(m => m.g))];
}

function renderSearch() {
  $("#content").innerHTML = `
    <h2 style="margin-top:20px">Find a movie</h2>

    <div class="searchbox">
      <span>⌕</span>
      <input
        id="q"
        placeholder="Search movies..."
        oninput="filterSearch(this.value)"
      >
    </div>

    <div id="results" class="grid">
      ${movies.map(card).join("")}
    </div>
  `;
}

function filterSearch(q) {
  const a = movies.filter(m =>
    (m.t + " " + m.g)
      .toLowerCase()
      .includes(q.toLowerCase())
  );

  $("#results").innerHTML = a.length
    ? a.map(card).join("")
    : `<div class="empty" style="grid-column:1/-1">
         No movies found.
       </div>`;
}

function renderGenres() {
  const gs = genres();

  $("#content").innerHTML = `
    <h2 style="margin-top:20px">Genres</h2>

    <div class="chips" style="flex-wrap:wrap">
      ${gs.map(g =>
        `<button class="chip" onclick="genre('${g}')">${g}</button>`
      ).join("")}
    </div>

    <div
      id="genreResults"
      class="grid"
      style="margin-top:22px">
      ${movies.map(card).join("")}
    </div>
  `;
}

function genre(g) {
  page("genres");

  setTimeout(() => {
    $("#genreResults").innerHTML =
      movies
        .filter(m => m.g === g)
        .map(card)
        .join("");
  }, 0);
}

function renderWatch() {
  const a = movies.filter(m => watch.includes(m.id));

  $("#content").innerHTML = `
    <h2 style="margin-top:20px">My Watchlist</h2>

    ${
      a.length
      ? `<div class="grid">${a.map(card).join("")}</div>`
      : `<div class="empty">
           Your watchlist is empty.<br>
           Add movies you want to watch later.
         </div>`
    }
  `;
}

function page(p) {
  current = p;

  document
    .querySelectorAll(".navbtn")
    .forEach(x =>
      x.classList.toggle("active", x.dataset.page === p)
    );

  ({
    home: renderHome,
    search: renderSearch,
    genres: renderGenres,
    watchlist: renderWatch
  }[p])();
}

function openMovie(id) {
  const m = movies.find(x => x.id === id);

  if (!m) return;

  const inW = watch.includes(id);

  $("#detail").innerHTML = `
    <div class="detail">

      <img
        class="detailposter"
        src="${m.img}"
      >

      <h2>${m.t}</h2>

      <div class="meta">
        ${m.g} · ${m.release || "2026"} · ★ ${m.r}
      </div>

      <p>${m.d}</p>

      <button
        class="btn primary"
        onclick="toggleWatch(${m.id});openMovie(${m.id})">
        ${inW ? "✓ In My List" : "＋ Add to My List"}
      </button>

      <button
        class="btn secondary"
        style="margin-left:7px"
        onclick="alert('Trailer feature coming next.')">
        ▶ Trailer
      </button>

      <div class="clear"></div>

      <h3>About this movie</h3>

      <p>
        Discover cast, release information, trailers
        and where to watch in MovieHub.
      </p>

    </div>
  `;

  $("#modal").classList.add("open");
}

function closeModal() {
  $("#modal").classList.remove("open");
}

function toggleWatch(id) {
  watch = watch.includes(id)
    ? watch.filter(x => x !== id)
    : [...watch, id];

  localStorage.setItem(
    "moviehub-watch",
    JSON.stringify(watch)
  );

  if (current === "watchlist") {
    renderWatch();
  }
}

document
  .querySelectorAll(".navbtn")
  .forEach(b =>
    b.onclick = () => page(b.dataset.page)
  );

loadMovies();
let watch=JSON.parse(localStorage.getItem("moviehub-watch")||"[]");
let current="home";
const $=s=>document.querySelector(s);
function card(m){return `<div class="card" onclick="openMovie(${m.id})"><img class="poster" src="${m.img}" loading="lazy"><div class="title">${m.t}</div><div class="rating">★ ${m.r}</div></div>`}
function renderHome(){let trending=movies.slice(0,5), popular=[...movies].sort((a,b)=>b.r-a.r);$("#content").innerHTML=`
<div class="hero"><div><div class="meta">FEATURED • 2026</div><h1>${movies[0].t}</h1><div class="meta">Sci-Fi · 2h 08m · ★ ${movies[0].r}</div><p class="desc">${movies[0].d}</p><div class="actions"><button class="btn primary" onclick="openMovie(1)">▶ Watch trailer</button><button class="btn secondary" onclick="toggleWatch(1)">♡ My list</button></div></div></div>
<section><div class="section-head"><h2>Trending now</h2><button class="see" onclick="page('search')">See all</button></div><div class="row">${trending.map(card).join("")}</div></section>
<section><div class="section-head"><h2>Popular</h2></div><div class="row">${popular.map(card).join("")}</div></section>
<section><div class="section-head"><h2>Browse genres</h2></div><div class="chips">${genres().map(g=>`<button class="chip" onclick="genre('${g}')">${g}</button>`).join("")}</div></section>`}
function genres(){return [...new Set(movies.map(m=>m.g))]}
function renderSearch(){let q="";$("#content").innerHTML=`<h2 style="margin-top:20px">Find a movie</h2><div class="searchbox"><span>⌕</span><input id="q" placeholder="Search movies..." oninput="filterSearch(this.value)"></div><div id="results" class="grid">${movies.map(card).join("")}</div>`}
function filterSearch(q){let a=movies.filter(m=>(m.t+" "+m.g).toLowerCase().includes(q.toLowerCase()));$("#results").innerHTML=a.length?a.map(card).join(""):`<div class="empty" style="grid-column:1/-1">No movies found.</div>`}
function renderGenres(){let gs=genres();$("#content").innerHTML=`<h2 style="margin-top:20px">Genres</h2><div class="chips" style="flex-wrap:wrap">${gs.map(g=>`<button class="chip" onclick="genre('${g}')">${g}</button>`).join("")}</div><div id="genreResults" class="grid" style="margin-top:22px">${movies.map(card).join("")}</div>`}
function genre(g){page("genres");setTimeout(()=>{$("#genreResults").innerHTML=movies.filter(m=>m.g===g).map(card).join("")},0)}
function renderWatch(){let a=movies.filter(m=>watch.includes(m.id));$("#content").innerHTML=`<h2 style="margin-top:20px">My Watchlist</h2>${a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty">Your watchlist is empty.<br>Add movies you want to watch later.</div>`}`}
function page(p){current=p;document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.page===p));({home:renderHome,search:renderSearch,genres:renderGenres,watchlist:renderWatch}[p])()}
function openMovie(id){let m=movies.find(x=>x.id===id), inW=watch.includes(id);$("#detail").innerHTML=`<div class="detail"><img class="detailposter" src="${m.img}"><h2>${m.t}</h2><div class="meta">${m.g} · 2026 · ★ ${m.r}</div><p>${m.d}</p><button class="btn primary" onclick="toggleWatch(${m.id});openMovie(${m.id})">${inW?"✓ In My List":"＋ Add to My List"}</button><button class="btn secondary" style="margin-left:7px" onclick="alert('Trailer demo — connect a video provider/API here.')">▶ Trailer</button><div class="clear"></div><h3>About this movie</h3><p>Discover cast, release information, trailers and where to watch in the full version of MovieHub.</p></div>`;$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}
function toggleWatch(id){watch=watch.includes(id)?watch.filter(x=>x!==id):[...watch,id];localStorage.setItem("moviehub-watch",JSON.stringify(watch));if(current==="watchlist")renderWatch()}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>page(b.dataset.page));renderHome();
</script>
</body>
</html>
