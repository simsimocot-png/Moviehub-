<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieHub — Prototype</title>

<style>
:root{--bg:#090a0f;--panel:#11131b;--panel2:#171a24;--text:#f7f7fa;--muted:#9a9eac;--accent:#e5095a;--line:#242733}
*{box-sizing:border-box}
body{margin:0;background:#05060a;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#090a0f,#08090d);padding-bottom:78px}
header{position:sticky;top:0;z-index:5;padding:18px 18px 12px;background:rgba(9,10,15,.88);backdrop-filter:blur(16px)}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;letter-spacing:-.8px}
.logo span{color:var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff4b91,#6d43ff);display:grid;place-items:center;font-weight:800}
main{padding:0 16px}
.hero{margin:10px 0 22px;border-radius:22px;min-height:410px;padding:26px 20px;display:flex;align-items:end;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.9) 100%);background-position:center;background-size:cover;box-shadow:0 15px 50px #0008}
.hero h1{font-size:35px;line-height:1;margin:8px 0}
.meta{color:#d6d7df;font-size:13px}
.desc{color:#c3c5ce;font-size:13px;line-height:1.45;max-width:420px}
.actions{display:flex;gap:9px;margin-top:15px}
.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:800}
.primary{background:#fff;color:#08090d}
.secondary{background:#ffffff18;color:#fff;border:1px solid #ffffff20}
section{margin:25px 0}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h2{font-size:18px;margin:0}
.see{font-size:12px;color:#ff6ba5;background:none;border:0}
.row{display:flex;gap:12px;overflow:auto;padding-bottom:5px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 125px}
.poster{height:180px;border-radius:13px;object-fit:cover;width:125px;background:#1a1c25;display:block}
.title{font-size:13px;font-weight:700;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating{font-size:11px;color:#ffc95c;margin-top:3px}
.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#cfd1da;padding:8px 13px;border-radius:999px;font-size:12px}
.searchbox{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:14px;margin:14px 0}
.searchbox input{width:100%;border:0;outline:0;background:none;color:#fff}
.searchbox span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.grid .card{min-width:0}
.grid .poster{width:100%;height:245px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:rgba(15,16,23,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:10}
.navbtn{background:none;border:0;color:#777b89;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.navbtn b{font-size:20px}
.navbtn.active{color:#fff}
.navbtn.active b{color:var(--accent)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end}
.modal.open{display:flex}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#10121a;border-radius:24px 24px 0 0;padding:20px}
.close{float:right;border:0;background:#ffffff12;color:#fff;border-radius:50%;width:34px;height:34px}
.detailposter{width:130px;height:190px;object-fit:cover;border-radius:14px;float:left;margin:0 16px 10px 0}
.detail h2{margin:4px 0 7px;font-size:25px}
.detail p{color:#b9bbc5;line-height:1.55;font-size:13px}
.clear{clear:both}

@media(min-width:700px){
body{background:#020307}
.app{box-shadow:0 0 80px #000}
.grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="top">
    <div class="logo">Movie<span>Hub</span></div>
    <div class="avatar">M</div>
  </div>
</header>

<main id="content"></main>

<nav>
  <button class="navbtn active" data-page="home">
    <b>⌂</b>Home
  </button>

  <button class="navbtn" data-page="search">
    <b>⌕</b>Search
  </button>

  <button class="navbtn" data-page="genres">
    <b>◈</b>Genres
  </button>

  <button class="navbtn" data-page="watchlist">
    <b>♡</b>Watchlist
  </button>
</nav>

</div>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" onclick="closeModal()">×</button>
    <div id="detail"></div>
  </div>
</div>

<script>
// ===============================
// MOVIEHUB JAVASCRIPT
// ===============================

const API = "https://moviehub-api.imessad-lyndadcot.workers.dev";

const $ = (selector) => document.querySelector(selector);

let movies = [];
let trending = [];
let popular = [];
let topRated = [];
let nowPlaying = [];
let upcoming = [];

let watch = JSON.parse(localStorage.getItem("moviehub_watchlist") || "[]");

// ===============================
// HELPERS
// ===============================

function imageUrl(path) {
  if (!path) {
    return "https://via.placeholder.com/500x750?text=No+Poster";
  }

  if (path.startsWith("http")) {
    return path;
  }

  return "https://image.tmdb.org/t/p/w500" + path;
}

function normalizeMovie(m) {
  return {
    id: m.id,
    t: m.title || m.name || "Untitled",
    img: imageUrl(m.poster_path),
    backdrop: imageUrl(m.backdrop_path || m.poster_path),
    r: m.vote_average ? Number(m.vote_average).toFixed(1) : "N/A",
    d: m.overview || "No description available.",
    release: m.release_date || "",
    g: "Movie"
  };
}

function uniqueMovies(list) {
  const seen = new Set();

  return list.filter(movie => {
    if (!movie || !movie.id) return false;

    if (seen.has(movie.id)) {
      return false;
    }

    seen.add(movie.id);
    return true;
  });
}

// ===============================
// FETCH API
// ===============================

async function getMovies(endpoint) {
  try {
    const response = await fetch(API + endpoint);

    if (!response.ok) {
      throw new Error("API error " + response.status);
    }

    const data = await response.json();

    return (data.results || []).map(normalizeMovie);

  } catch (error) {
    console.error("MovieHub API error:", endpoint, error);
    return [];
  }
}

// ===============================
// MOVIE CARD
// ===============================

function card(m) {
  return `
    <div class="card" onclick="openMovie(${m.id})">

      <img
        class="poster"
        src="${m.img}"
        alt="${m.t}"
        loading="lazy"
      >

      <div class="title">${m.t}</div>

      <div class="rating">
        ⭐ ${m.r}
      </div>

    </div>
  `;
}

// ===============================
// MOVIE SECTION
// ===============================

function movieSection(title, list) {

  if (!list || !list.length) {
    return "";
  }

  return `
    <section>

      <div class="section-head">
        <h2>${title}</h2>
      </div>

      <div class="row">
        ${list.map(card).join("")}
      </div>

    </section>
  `;
}

// ===============================
// HOME PAGE
// ===============================

function renderHome() {

  if (!movies.length) {
    $("#content").innerHTML = `
      <div class="empty">
        Loading movies...
      </div>
    `;

    return;
  }

  const heroMovie =
    trending[0] ||
    popular[0] ||
    movies[0];

  $("#content").innerHTML = `

    <div
      class="hero"
      style="
        background-image:
        linear-gradient(
          180deg,
          transparent 20%,
          rgba(0,0,0,.95) 100%
        ),
        url('${heroMovie.backdrop || heroMovie.img}');
      "
      onclick="openMovie(${heroMovie.id})"
    >

      <div>

        <div class="meta">
          ⭐ ${heroMovie.r}
        </div>

        <h1>${heroMovie.t}</h1>

        <div class="meta">
          ${heroMovie.release || "Movie"}
        </div>

        <p class="desc">
          ${heroMovie.d}
        </p>

        <div class="actions">

          <button
            class="btn primary"
            onclick="event.stopPropagation(); openMovie(${heroMovie.id})"
          >
            ▶ Watch
          </button>

          <button
            class="btn secondary"
            onclick="event.stopPropagation(); toggleWatch(${heroMovie.id})"
          >
            ♡ My List
          </button>

        </div>

      </div>

    </div>

    ${movieSection("Trending Now", trending)}

    ${movieSection("Popular Movies", popular)}

    ${movieSection("Top Rated", topRated)}

    ${movieSection("Now Playing", nowPlaying)}

    ${movieSection("Coming Soon", upcoming)}

  `;
}

// ===============================
// SEARCH PAGE
// ===============================

function renderSearch() {

  $("#content").innerHTML = `

    <section>

      <h2>Search Movies</h2>

      <div class="searchbox">

        <span>⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search for a movie..."
          autocomplete="off"
        >

      </div>

      <div id="searchResults"></div>

    </section>

  `;

  const input = $("#searchInput");

  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      searchMovies(input.value.trim());
    }

  });

  input.focus();
}

// ===============================
// SEARCH MOVIES
// ===============================

async function searchMovies(query) {

  const resultsBox = $("#searchResults");

  if (!resultsBox) return;

  if (!query) {

    resultsBox.innerHTML = `
      <div class="empty">
        Type a movie name and press Enter.
      </div>
    `;

    return;
  }

  resultsBox.innerHTML = `
    <div class="empty">
      Searching...
    </div>
  `;

  try {

    const response = await fetch(
      `${API}/search?q=${encodeURIComponent(query)}`
    );

    if (!response.ok) {
      throw new Error("Search failed");
    }

    const data = await response.json();

    const results = uniqueMovies(
      (data.results || []).map(normalizeMovie)
    );

    if (!results.length) {

      resultsBox.innerHTML = `
        <div class="empty">
          No movies found for "${query}".
        </div>
      `;

      return;
    }

    resultsBox.innerHTML = `

      <div class="grid">
        ${results.map(card).join("")}
      </div>

    `;

  } catch (error) {

    console.error(error);

    resultsBox.innerHTML = `
      <div class="empty">
        Something went wrong. Please try again.
      </div>
    `;

  }
}

// ===============================
// GENRES
// ===============================

const GENRES = [
  { id: 28, name: "Action" },
  { id: 12, name: "Adventure" },
  { id: 16, name: "Animation" },
  { id: 35, name: "Comedy" },
  { id: 80, name: "Crime" },
  { id: 18, name: "Drama" },
  { id: 14, name: "Fantasy" },
  { id: 27, name: "Horror" },
  { id: 9648, name: "Mystery" },
  { id: 10749, name: "Romance" },
  { id: 878, name: "Science Fiction" },
  { id: 53, name: "Thriller" },
  { id: 10752, name: "War" },
  { id: 37, name: "Western" }
];

function renderGenres() {

  $("#content").innerHTML = `

    <section>

      <div class="section-head">
        <h2>Genres</h2>
      </div>

      <div class="chips">

        ${GENRES.map(genre => `
          <button
            class="chip"
            onclick="loadGenre(${genre.id}, '${genre.name}')"
          >
            ${genre.name}
          </button>
        `).join("")}

      </div>

      <div id="genreResults"></div>

    </section>

  `;
}

// ===============================
// LOAD GENRE
// ===============================

async function loadGenre(id, name) {

  const box = $("#genreResults");

  if (!box) return;

  box.innerHTML = `
    <div class="empty">
      Loading ${name} movies...
    </div>
  `;

  try {

    const response = await fetch(
      `${API}/genre?id=${id}`
    );

    if (!response.ok) {
      throw new Error("Genre request failed");
    }

    const data = await response.json();

    const results = uniqueMovies(
      (data.results || []).map(normalizeMovie)
    );

    if (!results.length) {

      box.innerHTML = `
        <div class="empty">
          No movies found.
        </div>
      `;

      return;
    }

    box.innerHTML = `

      <h2 style="margin-top:25px">
        ${name}
      </h2>

      <div class="grid">
        ${results.map(card).join("")}
      </div>

    `;

  } catch (error) {

    console.error(error);

    box.innerHTML = `
      <div class="empty">
        Could not load this genre.
      </div>
    `;

  }
}

// ===============================
// WATCHLIST
// ===============================

function saveWatchlist() {

  localStorage.setItem(
    "moviehub_watchlist",
    JSON.stringify(watch)
  );

}

function toggleWatch(id) {

  if (watch.includes(id)) {

    watch = watch.filter(movieId => movieId !== id);

  } else {

    watch.push(id);

  }

  saveWatchlist();

  openMovie(id);

  if (
    document.querySelector(".navbtn.active")?.dataset.page ===
    "watchlist"
  ) {
    renderWatchlist();
  }

}

// ===============================
// WATCHLIST PAGE
// ===============================

function renderWatchlist() {

  const list = movies.filter(m =>
    watch.includes(m.id)
  );

  $("#content").innerHTML = `

    <section>

      <div class="section-head">
        <h2>My Watchlist</h2>
      </div>

      ${
        list.length
          ? `
            <div class="grid">
              ${list.map(card).join("")}
            </div>
          `
          : `
            <div class="empty">

              Your watchlist is empty.

              <br><br>

              Add movies you want to watch later.

            </div>
          `
      }

    </section>

  `;
}

// ===============================
// MOVIE DETAILS
// ===============================

function openMovie(id) {

  const movie = movies.find(m => m.id === id);

  if (!movie) {
    console.warn("Movie not found:", id);
    return;
  }

  $("#detail").innerHTML = `

    <img
      class="detailposter"
      src="${movie.img}"
      alt="${movie.t}"
    >

    <div class="detail">

      <h2>${movie.t}</h2>

      <p>
        ⭐ ${movie.r}
        ${movie.release ? ` · ${movie.release}` : ""}
      </p>

      <p>
        ${movie.d}
      </p>

      <button
        class="btn primary"
        onclick="toggleWatch(${movie.id})"
      >
        ${
          watch.includes(movie.id)
            ? "Remove from Watchlist"
            : "Add to Watchlist"
        }
      </button>

      <div class="clear"></div>

    </div>

  `;

  $("#modal").classList.add("open");

}

// ===============================
// CLOSE MODAL
// ===============================

function closeModal() {

  $("#modal").classList.remove("open");

  $("#detail").innerHTML = "";

}

// ===============================
// NAVIGATION
// ===============================

function setActivePage(page) {

  document.querySelectorAll(".navbtn").forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.page === page
    );

  });

}

// ===============================
// NAV BUTTONS
// ===============================

document.querySelectorAll(".navbtn").forEach(button => {

  button.addEventListener("click", () => {

    const page = button.dataset.page;

    setActivePage(page);

    if (page === "home") {
      renderHome();
    }

    if (page === "search") {
      renderSearch();
    }

    if (page === "genres") {
      renderGenres();
    }

    if (page === "watchlist") {
      renderWatchlist();
    }

  });

});

// ===============================
// LOAD ALL MOVIES
// ===============================

async function loadMovies() {

  $("#content").innerHTML = `
    <div class="empty">
      Loading MovieHub...
    </div>
  `;

  try {

    const [
      trendingData,
      popularData,
      topRatedData,
      nowPlayingData,
      upcomingData
    ] = await Promise.all([

      getMovies("/trending"),

      getMovies("/popular"),

      getMovies("/top-rated"),

      getMovies("/now-playing"),

      getMovies("/upcoming")

    ]);

    trending = trendingData;
    popular = popularData;
    topRated = topRatedData;
    nowPlaying = nowPlayingData;
    upcoming = upcomingData;

    movies = uniqueMovies([
      ...trending,
      ...popular,
      ...topRated,
      ...nowPlaying,
      ...upcoming
    ]);

    console.log("MovieHub loaded:", movies.length, "movies");

    renderHome();

  } catch (error) {

    console.error("MovieHub loading error:", error);

    $("#content").innerHTML = `
      <div class="empty">

        Could not load movies.

        <br><br>

        Please check your internet connection
        and try again.

      </div>
    `;

  }

}

// ===============================
// CLOSE MODAL WHEN CLICKING
// OUTSIDE THE SHEET
// ===============================

$("#modal").addEventListener("click", function(event) {

  if (event.target === this) {
    closeModal();
  }

});

// ===============================
// START MOVIEHUB
// ===============================

loadMovies();
              


</script>

</body>
  </html>
