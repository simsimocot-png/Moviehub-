========================= */

button {

}

button:active {

}

/* =========================
   APP
========================= */

.app {

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 10;

  padding: 18px 18px 14px;

  background:
    rgba(8, 9, 14, .88);

  backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(255,255,255,.03);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span {
  color: var(--accent);
}

.avatar {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  display: grid;
  place-items: center;

  background:
    linear-gradient(
      135deg,
      #ff4b91,
      #6545ff
    );

  font-weight: 900;
}

/* =========================
   MAIN
========================= */

main {
  padding: 0 16px;
}

section {
  margin: 25px 0;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 13px;
}

.section-head h2 {
  margin: 0;

  font-size: 19px;
  font-weight: 850;
}

// ===============================
// GENRES
// ===============================

const GENRES = [
  { id: 28, name: "Action" },
  { id: 12, name: "Adventure" },
  { id: 16, name: "Animation" },
  { id: 35, name: "Comedy" },
  { id: 80, name: "Crime" },
  { id: 18, name: "Drama" },
  { id: 14, name: "Fantasy" },
  { id: 27, name: "Horror" },
  { id: 9648, name: "Mystery" },
  { id: 10749, name: "Romance" },
  { id: 878, name: "Science Fiction" },
  { id: 53, name: "Thriller" },
  { id: 10752, name: "War" },
  { id: 37, name: "Western" }
];

function renderGenres() {

  $("#content").innerHTML = `

    <section>

      <div class="section-head">
        <h2>Genres</h2>
      </div>

      <div class="chips">

        ${GENRES.map(genre => `
          <button
            class="chip"
            onclick="loadGenre(${genre.id}, '${genre.name}')"
          >
            ${genre.name}
          </button>
        `).join("")}

      </div>

      <div id="genreResults"></div>

    </section>

  `;
}

// ===============================
// LOAD GENRE
// ===============================

async function loadGenre(id, name) {

  const box = $("#genreResults");

  if (!box) return;

  box.innerHTML = `
    <div class="empty">
      Loading ${name} movies...
    </div>
  `;

  try {

    const response = await fetch(
      `${API}/genre?id=${id}`
    );

    if (!response.ok) {
      throw new Error("Genre request failed");
    }

    const data = await response.json();

    const results = uniqueMovies(
      (data.results || []).map(normalizeMovie)
    );

    if (!results.length) {

      box.innerHTML = `
        <div class="empty">
          No movies found.
        </div>
      `;

      return;
    }

    box.innerHTML = `

      <h2 style="margin-top:25px">
        ${name}
      </h2>

      <div class="grid">
        ${results.map(card).join("")}
      </div>

    `;

  } catch (error) {

    console.error(error);

    box.innerHTML = `
      <div class="empty">
        Could not load this genre.
      </div>
    `;

  }
}

// ===============================
// WATCHLIST
// ===============================

function saveWatchlist() {

  localStorage.setItem(
    "moviehub_watchlist",
    JSON.stringify(watch)
  );

}

function toggleWatch(id) {

  if (watch.includes(id)) {

    watch = watch.filter(movieId => movieId !== id);

  } else {

    watch.push(id);

  }

  saveWatchlist();

  openMovie(id);

  if (
    document.querySelector(".navbtn.active")?.dataset.page ===
    "watchlist"
  ) {
    renderWatchlist();
  }

}

// ===============================
// WATCHLIST PAGE
// ===============================

function renderWatchlist() {

  const list = movies.filter(m =>
    watch.includes(m.id)
  );

  $("#content").innerHTML = `

    <section>

      <div class="section-head">
        <h2>My Watchlist</h2>
      </div>

      ${
        list.length
          ? `
            <div class="grid">
              ${list.map(card).join("")}
            </div>
          `
          : `
            <div class="empty">

              Your watchlist is empty.

              <br><br>

              Add movies you want to watch later.

            </div>
          `
      }

    </section>

  `;
}

// ===============================
// MOVIE DETAILS
// ===============================

function openMovie(id) {

  const movie = movies.find(m => m.id === id);

  if (!movie) {
    console.warn("Movie not found:", id);
    return;
  }

  $("#detail").innerHTML = `

    <img
      class="detailposter"
      src="${movie.img}"
      alt="${movie.t}"
    >

    <div class="detail">

      <h2>${movie.t}</h2>

      <p>
        ⭐ ${movie.r}
        ${movie.release ? ` · ${movie.release}` : ""}
      </p>

      <p>
        ${movie.d}
      </p>

      <button
        class="btn primary"
        onclick="toggleWatch(${movie.id})"
      >
        ${
          watch.includes(movie.id)
            ? "Remove from Watchlist"
            : "Add to Watchlist"
        }
      </button>

      <div class="clear"></div>

    </div>

  `;

  $("#modal").classList.add("open");

}

// ===============================
// CLOSE MODAL
// ===============================

function closeModal() {

  $("#modal").classList.remove("open");

  $("#detail").innerHTML = "";

}

// ===============================
// NAVIGATION
// ===============================

function setActivePage(page) {

  document.querySelectorAll(".navbtn").forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.page === page
    );

  });

}

// ===============================
// NAV BUTTONS
// ===============================

document.querySelectorAll(".navbtn").forEach(button => {

  button.addEventListener("click", () => {

    const page = button.dataset.page;

    setActivePage(page);

    if (page === "home") {
      renderHome();
    }

    if (page === "search") {
      renderSearch();
    }

    if (page === "genres") {
      renderGenres();
    }

    if (page === "watchlist") {
      renderWatchlist();
    }

  });

});

// ===============================
// LOAD ALL MOVIES
// ===============================

async function loadMovies() {

  $("#content").innerHTML = `
    <div class="empty">
      Loading MovieHub...
    </div>
  `;

  try {

    const [
      trendingData,
      popularData,
      topRatedData,
      nowPlayingData,
      upcomingData
    ] = await Promise.all([

      getMovies("/trending"),

      getMovies("/popular"),

      getMovies("/top-rated"),

      getMovies("/now-playing"),

      getMovies("/upcoming")

    ]);

    trending = trendingData;
    popular = popularData;
    topRated = topRatedData;
    nowPlaying = nowPlayingData;
    upcoming = upcomingData;

    movies = uniqueMovies([
      ...trending,
      ...popular,
      ...topRated,
      ...nowPlaying,
      ...upcoming
    ]);

    console.log("MovieHub loaded:", movies.length, "movies");

    renderHome();

  } catch (error) {

    console.error("MovieHub loading error:", error);

    $("#content").innerHTML = `
      <div class="empty">

        Could not load movies.

        <br><br>

        Please check your internet connection
        and try again.

      </div>
    `;

  }

}

// ===============================
// CLOSE MODAL WHEN CLICKING
// OUTSIDE THE SHEET
// ===============================

$("#modal").addEventListener("click", function(event) {

  if (event.target === this) {
    closeModal();
  }

});

// ===============================
// START MOVIEHUB
// ===============================

loadMovies();
              


</script>
