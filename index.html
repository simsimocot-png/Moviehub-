<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieHub — Prototype</title>

<style>
:root{--bg:#090a0f;--panel:#11131b;--panel2:#171a24;--text:#f7f7fa;--muted:#9a9eac;--accent:#e5095a;--line:#242733}
*{box-sizing:border-box}
body{margin:0;background:#05060a;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#090a0f,#08090d);padding-bottom:78px}
header{position:sticky;top:0;z-index:5;padding:18px 18px 12px;background:rgba(9,10,15,.88);backdrop-filter:blur(16px)}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;letter-spacing:-.8px}
.logo span{color:var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff4b91,#6d43ff);display:grid;place-items:center;font-weight:800}
main{padding:0 16px}
.hero{margin:10px 0 22px;border-radius:22px;min-height:410px;padding:26px 20px;display:flex;align-items:end;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.9) 100%);background-position:center;background-size:cover;box-shadow:0 15px 50px #0008}
.hero h1{font-size:35px;line-height:1;margin:8px 0}
.meta{color:#d6d7df;font-size:13px}
.desc{color:#c3c5ce;font-size:13px;line-height:1.45;max-width:420px}
.actions{display:flex;gap:9px;margin-top:15px}
.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:800}
.primary{background:#fff;color:#08090d}
.secondary{background:#ffffff18;color:#fff;border:1px solid #ffffff20}
section{margin:25px 0}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h2{font-size:18px;margin:0}
.see{font-size:12px;color:#ff6ba5;background:none;border:0}
.row{display:flex;gap:12px;overflow:auto;padding-bottom:5px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 125px}
.poster{height:180px;border-radius:13px;object-fit:cover;width:125px;background:#1a1c25;display:block}
.title{font-size:13px;font-weight:700;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating{font-size:11px;color:#ffc95c;margin-top:3px}
.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#cfd1da;padding:8px 13px;border-radius:999px;font-size:12px}
.searchbox{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:14px;margin:14px 0}
.searchbox input{width:100%;border:0;outline:0;background:none;color:#fff}
.searchbox span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.grid .card{min-width:0}
.grid .poster{width:100%;height:245px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:rgba(15,16,23,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:10}
.navbtn{background:none;border:0;color:#777b89;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.navbtn b{font-size:20px}
.navbtn.active{color:#fff}
.navbtn.active b{color:var(--accent)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end}
.modal.open{display:flex}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#10121a;border-radius:24px 24px 0 0;padding:20px}
.close{float:right;border:0;background:#ffffff12;color:#fff;border-radius:50%;width:34px;height:34px}
.detailposter{width:130px;height:190px;object-fit:cover;border-radius:14px;float:left;margin:0 16px 10px 0}
.detail h2{margin:4px 0 7px;font-size:25px}
.detail p{color:#b9bbc5;line-height:1.55;font-size:13px}
.clear{clear:both}

@media(min-width:700px){
body{background:#020307}
.app{box-shadow:0 0 80px #000}
.grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="top">
    <div class="logo">Movie<span>Hub</span></div>
    <div class="avatar">M</div>
  </div>
</header>

<main id="content"></main>

<nav>
  <button class="navbtn active" data-page="home">
    <b>⌂</b>Home
  </button>

  <button class="navbtn" data-page="search">
    <b>⌕</b>Search
  </button>

  <button class="navbtn" data-page="genres">
    <b>◈</b>Genres
  </button>

  <button class="navbtn" data-page="watchlist">
    <b>♡</b>Watchlist
  </button>
</nav>

</div>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" onclick="closeModal()">×</button>
    <div id="detail"></div>
  </div>
</div>

<script>

const API = "https://moviehub-api.imessad-lyndadcot.workers.dev";

let movies = [];

let watch = JSON.parse(
  localStorage.getItem("moviehub-watch") || "[]"
);

let current = "home";

const $ = s => document.querySelector(s);


// ===============================
// GENRES
// ===============================

const GENRES = {
  28: "Action",
  12: "Adventure",
  16: "Animation",
  35: "Comedy",
  80: "Crime",
  99: "Documentary",
  18: "Drama",
  10751: "Family",
  14: "Fantasy",
  36: "History",
  27: "Horror",
  10402: "Music",
  9648: "Mystery",
  10749: "Romance",
  878: "Science Fiction",
  53: "Thriller",
  10752: "War",
  37: "Western"
};

function genreName(id) {
  return GENRES[id] || "Movie";
}


// ===============================
// NORMALIZE TMDB MOVIE
// ===============================

function normalizeMovie(m) {

  return {
    id: m.id,

    t:
      m.title ||
      m.original_title ||
      "Untitled",

    g:
      genreName(
        m.genre_ids?.[0]
      ),

    r:
      Number(
        m.vote_average || 0
      ).toFixed(1),

    img:
      m.poster_path

        ? `https://image.tmdb.org/t/p/w500${m.poster_path}`

        : "https://via.placeholder.com/500x750?text=No+Poster",

    backdrop:
      m.backdrop_path

        ? `https://image.tmdb.org/t/p/w1280${m.backdrop_path}`

        : "",

    d:
      m.overview ||
      "No description available.",

    release:
      m.release_date || ""
  };
}


// ===============================
// MOVIE CARD
// ===============================

function card(m) {

  return `
    <div
      class="card"
      onclick="openMovie(${m.id})"
    >

      <img
        src="${m.img}"
        alt="${m.t}"
      >

      <div class="cardbody">

        <h3>
          ${m.t}
        </h3>

        <div class="meta">

          <span>
            ⭐ ${m.r}
          </span>

          <span>
            ${m.g}
          </span>

        </div>

      </div>

    </div>
  `;
}


// ===============================
// GET MOVIES FROM WORKER
// ===============================

async function getMovies(endpoint) {

  const response =
    await fetch(
      `${API}/${endpoint}`
    );

  if (!response.ok) {

    throw new Error(
      `${endpoint} failed: ${response.status}`
    );

  }

  const data =
    await response.json();

  return (
    data.results || []
  )
    .filter(
      m =>
        !m.media_type ||
        m.media_type === "movie"
    )
    .map(normalizeMovie);
}


// ===============================
// LOAD ALL MOVIES
// ===============================

async function loadMovies() {

  $("#content").innerHTML = `

    <div class="empty">

      <h3>
        Loading movies...
      </h3>

    </div>

  `;

  try {

    const [
      trending,
      popular,
      topRated,
      nowPlaying,
      upcoming
    ] = await Promise.all([

      getMovies("trending"),

      getMovies("popular"),

      getMovies("top-rated"),

      getMovies("now-playing"),

      getMovies("upcoming")

    ]);


    // Combine all movies
    movies = [

      ...trending,

      ...popular,

      ...topRated,

      ...nowPlaying,

      ...upcoming

    ];


    // Remove duplicates
    movies =
      movies.filter(
        (movie, index, self) =>
          index ===
          self.findIndex(
            x =>
              x.id === movie.id
          )
      );


    renderHome({

      trending,

      popular,

      topRated,

      nowPlaying,

      upcoming

    });


  } catch (error) {

    console.error(
      "MovieHub API error:",
      error
    );


    $("#content").innerHTML = `

      <div class="empty">

        <h3>
          Unable to load movies
        </h3>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }
}


// ===============================
// MOVIE SECTION
// ===============================

function movieSection(
  title,
  list
) {

  return `

    <section class="section">

      <div class="sectiontitle">

        <h2>
          ${title}
        </h2>

      </div>


      <div class="grid">

        ${
          list.length
            ? list
                .map(card)
                .join("")
            : `
              <p>
                No movies available.
              </p>
            `
        }

      </div>

    </section>

  `;
}


// ===============================
// HOME PAGE
// ===============================

function renderHome(data) {

  $("#content").innerHTML = `

    ${movieSection(
      "🔥 Trending Movies",
      data.trending
    )}


    ${movieSection(
      "⭐ Popular Movies",
      data.popular
    )}


    ${movieSection(
      "🏆 Top Rated Movies",
      data.topRated
    )}


    ${movieSection(
      "🎬 Now Playing",
      data.nowPlaying
    )}


    ${movieSection(
      "📅 Upcoming Movies",
      data.upcoming
    )}

  `;
}


// ===============================
// SEARCH PAGE
// ===============================

function renderSearch() {

  $("#content").innerHTML = `

    <div class="searchbox">

      <input
        id="searchInput"
        type="text"
        placeholder="Search movies..."
        oninput="filterSearch(this.value)"
      >

    </div>


    <div
      id="searchResults"
      class="grid"
    ></div>

  `;
}


function filterSearch(value) {

  const q =
    value
      .toLowerCase()
      .trim();


  if (!q) {

    $("#searchResults").innerHTML = "";

    return;

  }


  const results =
    movies.filter(
      m =>
        m.t
          .toLowerCase()
          .includes(q)
    );


  $("#searchResults").innerHTML =

    results.length

      ? results
          .map(card)
          .join("")

      : `

        <div class="empty">

          No movies found.

        </div>

      `;
}


// ===============================
// GENRES PAGE
// ===============================

function renderGenres() {

  const genres =
    [
      ...new Set(
        movies.map(
          m => m.g
        )
      )
    ];


  $("#content").innerHTML = `

    <h2>
      Genres
    </h2>


    <div class="genrelist">

      ${genres
        .map(
          g => `

            <button
              onclick="genre('${g}')"
            >
              ${g}
            </button>

          `
        )
        .join("")}

    </div>


    <div
      id="genreMovies"
      class="grid"
    ></div>

  `;
}


function genre(g) {

  const results =
    movies.filter(
      m => m.g === g
    );


  $("#genreMovies").innerHTML =

    results.length

      ? results
          .map(card)
          .join("")

      : `

        <div class="empty">

          No movies found.

        </div>

      `;
}


// ===============================
// WATCHLIST
// ===============================

function renderWatch() {

  const list =
    movies.filter(
      m =>
        watch.includes(
          m.id
        )
    );


  $("#content").innerHTML = `

    <h2>
      My Watchlist
    </h2>


    ${
      list.length

        ? `

          <div class="grid">

            ${list
              .map(card)
              .join("")}

          </div>

        `

        : `

          <div class="empty">

            <p>
              Your watchlist is empty.
            </p>

            <p>
              Add movies you want
              to watch later.
            </p>

          </div>

        `
    }

  `;
}


// ===============================
// NAVIGATION
// ===============================

function page(p) {

  current = p;


  document
    .querySelectorAll(".navbtn")
    .forEach(
      x => {

        x.classList.toggle(
          "active",
          x.dataset.page === p
        );

      }
    );


  if (p === "home") {

    loadMovies();

  }

  else if (p === "search") {

    renderSearch();

  }

  else if (p === "genres") {

    renderGenres();

  }

  else if (p === "watchlist") {

    renderWatch();

  }

}


// ===============================
// MOVIE DETAILS
// ===============================

function openMovie(id) {

  const m =
    movies.find(
      x => x.id === id
    );


  if (!m) return;


  const modal =
    document.createElement(
      "div"
    );


  modal.className =
    "modal";


  modal.innerHTML = `

    <div class="modalbox">


      <button
        class="close"
        onclick="
          this.closest('.modal').remove()
        "
      >
        ×
      </button>


      ${
        m.backdrop

          ? `

            <img
              src="${m.backdrop}"
              class="backdrop"
              alt="${m.t}"
            >

          `

          : ""
      }


      <div class="modalcontent">


        <h2>
          ${m.t}
        </h2>


        <p>

          ⭐ ${m.r}

          · ${m.g}

          ${
            m.release
              ? `· ${m.release}`
              : ""
          }

        </p>


        <p>
          ${m.d}
        </p>


        <button
          onclick="
            toggleWatch(${m.id})
          "
        >

          ${
            watch.includes(m.id)

              ? "Remove from Watchlist"

              : "Add to Watchlist"
          }

        </button>


      </div>

    </div>

  `;


  document
    .body
    .appendChild(modal);

}


// ===============================
// WATCHLIST BUTTON
// ===============================

function toggleWatch(id) {

  if (
    watch.includes(id)
  ) {

    watch =
      watch.filter(
        x => x !== id
      );

  }

  else {

    watch.push(id);

  }


  localStorage.setItem(
    "moviehub-watch",
    JSON.stringify(watch)
  );


  document
    .querySelector(".modal")
    ?.remove();


  if (
    current === "watchlist"
  ) {

    renderWatch();

  }

}


// ===============================
// NAV BUTTONS
// ===============================

document
  .querySelectorAll(".navbtn")
  .forEach(
    b => {

      b.onclick = () =>
        page(
          b.dataset.page
        );

    }
  );


// ===============================
// START MOVIEHUB
// ===============================

loadMovies();
  `








</script>

</body>
  </html>
