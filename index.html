<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MovieHub</title>

<style>

/* =========================
   GLOBAL
========================= */

:root {
  --bg: #07080d;
  --panel: #11131b;
  --panel2: #181b25;
  --text: #ffffff;
  --muted: #a4a7b3;
  --accent: #e5095a;
  --gold: #ffc857;
  --line: #252936;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #020307;
  color: var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

/* =========================
   APP
========================= */

.app {
  width: 100%;
  max-width: 560px;
  min-height: 100vh;
  margin: auto;
  background:
    linear-gradient(
      180deg,
      #090a0f,
      #07080d
    );
  padding-bottom: 90px;
}

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 10;

  padding: 18px 18px 14px;

  background:
    rgba(8, 9, 14, .88);

  backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(255,255,255,.03);
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span {
  color: var(--accent);
}

.avatar {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  display: grid;
  place-items: center;

  background:
    linear-gradient(
      135deg,
      #ff4b91,
      #6545ff
    );

  font-weight: 900;
}

/* =========================
   MAIN
========================= */

main {
  padding: 0 16px;
}

section {
  margin: 25px 0;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 13px;
}

.section-head h2 {
  margin: 0;

  font-size: 19px;
  font-weight: 850;
}

/* =========================
   HERO
========================= */

.hero {
  min-height: 430px;

  margin: 12px 0 26px;

  padding: 25px 20px;

  border-radius: 23px;

  display: flex;
  align-items: flex-end;

  background-size: cover;
  background-position: center;

  position: relative;

  overflow: hidden;

  box-shadow:
    0 20px 60px rgba(0,0,0,.55);
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      180deg,
      transparent 15%,
      rgba(0,0,0,.92) 100%
    );
}

.hero h1 {
  position: relative;
  z-index: 2;

  margin: 8px 0;

  font-size: 36px;
  line-height: 1;

  letter-spacing: -1px;
}

.hero .meta,
.hero .description,
.hero .actions {
  position: relative;
  z-index: 2;
}

.meta {
  color: #d8dae2;
  font-size: 13px;
}

.description {
  max-width: 440px;

  color: #c2c5cf;

  font-size: 13px;
  line-height: 1.5;
}

/* =========================
   BUTTONS
========================= */

.actions {
  display: flex;
  gap: 9px;

  margin-top: 15px;
}

.btn {
  border: 0;

  border-radius: 12px;

  padding: 11px 17px;

  font-weight: 800;
}

.primary {
  background: #ffffff;
  color: #08090d;
}

.secondary {
  background: rgba(255,255,255,.10);
  color: #fff;

  border: 1px solid rgba(255,255,255,.12);
}

.favorite-btn {
  background: rgba(255,255,255,.10);
  color: #fff;

  border: 1px solid rgba(255,255,255,.12);
}

/* =========================
   MOVIE ROW
========================= */

.row {
  display: flex;

  gap: 12px;

  overflow-x: auto;

  padding-bottom: 5px;

  scrollbar-width: none;
}

.row::-webkit-scrollbar {
  display: none;
}

.card {
  position: relative;

  flex: 0 0 125px;

  min-width: 125px;

  cursor: pointer;
}

.poster {
  width: 125px;
  height: 180px;

  object-fit: cover;

  display: block;

  border-radius: 13px;

  background: #191b24;
}

.title {
  margin-top: 7px;

  font-size: 13px;
  font-weight: 750;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.rating {
  margin-top: 3px;

  color: var(--gold);

  font-size: 11px;
}

/* =========================
   FAVORITE HEART
========================= */

.heart {
  position: absolute;

  top: 7px;
  right: 7px;

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 50%;

  background: rgba(0,0,0,.65);

  color: white;

  font-size: 18px;

  display: grid;
  place-items: center;

  z-index: 3;
}

.heart.active {
  color: #ff3d78;
}

/* =========================
   GRID
========================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 16px;
}

.grid .card {
  min-width: 0;
}

.grid .poster {
  width: 100%;
  height: 250px;
}

/* =========================
   SEARCH
========================= */

.searchbox {
  display: flex;

  align-items: center;

  gap: 9px;

  margin: 14px 0;

  padding: 11px 13px;

  background: var(--panel);

  border:
    1px solid
    var(--line);

  border-radius: 14px;
}

.searchbox span {
  color: var(--muted);
  font-size: 20px;
}

.searchbox input {
  width: 100%;

  border: 0;
  outline: 0;

  background: none;

  color: white;
}

.searchbox input::placeholder {
  color: #777b88;
}

/* =========================
   GENRES
========================= */

.chips {
  display: flex;

  gap: 8px;

  overflow-x: auto;

  scrollbar-width: none;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  white-space: nowrap;

  border:
    1px solid
    var(--line);

  background: var(--panel);

  color: #d1d3dc;

  padding: 9px 14px;

  border-radius: 999px;

  font-size: 12px;
}

.chip:hover {
  background: var(--panel2);
}

/* =========================
   EMPTY
========================= */

.empty {
  padding: 45px 10px;

  text-align: center;

  color: var(--muted);

  line-height: 1.6;
}

/* =========================
   BOTTOM NAV
========================= */

nav {
  position: fixed;

  bottom: 0;
  left: 50%;

  transform: translateX(-50%);

  width: min(560px, 100%);

  height: 72px;

  background:
    rgba(15,16,23,.95);

  backdrop-filter: blur(18px);

  border-top:
    1px solid
    var(--line);

  display: flex;

  justify-content: space-around;
  align-items: center;

  z-index: 20;
}

.navbtn {
  background: none;

  border: 0;

  color: #777b89;

  font-size: 10px;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 4px;
}

.navbtn b {
  font-size: 21px;
}

.navbtn.active {
  color: white;
}

.navbtn.active b {
  color: var(--accent);
}

/* =========================
   MODAL
========================= */

.modal {
  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.78);

  z-index: 100;

  display: none;

  align-items: flex-end;
}

.modal.open {
  display: flex;
}

.sheet {
  width: min(560px,100%);

  max-height: 92vh;

  overflow-y: auto;

  background: #10121a;

  border-radius:
    25px
    25px
    0
    0;

  padding: 20px;
}

.close {
  float: right;

  border: 0;

  background:
    rgba(255,255,255,.10);

  color: white;

  border-radius: 50%;

  width: 36px;
  height: 36px;

  font-size: 20px;
}

.detailposter {
  width: 135px;
  height: 195px;

  object-fit: cover;

  border-radius: 14px;

  float: left;

  margin:
    0
    17px
    12px
    0;
}

.detail h2 {
  margin: 5px 0 8px;

  font-size: 25px;
}

.detail p {
  color: #b9bbc5;

  line-height: 1.55;

  font-size: 13px;
}

.clear {
  clear: both;
}

.detail-actions {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 15px;
}

/* =========================
   LOADING
========================= */

.loading {
  padding: 60px 10px;

  text-align: center;

  color: var(--muted);
}

.spinner {
  width: 30px;
  height: 30px;

  margin: 0 auto 15px;

  border:
    3px solid
    #333;

  border-top-color:
    var(--accent);

  border-radius: 50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

  body {
    background: #020307;
  }

  .app {
    box-shadow:
      0 0 90px rgba(0,0,0,.7);
  }

  .grid {
    grid-template-columns:
      repeat(3,1fr);
  }

}

</style>

</head>


<body>

<div class="app">

<!-- =========================
     HEADER
========================= -->

<header>

  <div class="top">

    <div class="logo">
      Movie<span>Hub</span>
    </div>

    <div class="avatar">
      M
    </div>

  </div>

</header>


<!-- =========================
     MAIN CONTENT
========================= -->

<main id="content">

  <div class="loading">

    <div class="spinner"></div>

    Loading MovieHub...

  </div>

</main>


<!-- =========================
     BOTTOM NAVIGATION
========================= -->

<nav>

  <button
    class="navbtn active"
    data-page="home"
  >

    <b>⌂</b>

    Home

  </button>


  <button
    class="navbtn"
    data-page="search"
  >

    <b>⌕</b>

    Search

  </button>


  <button
    class="navbtn"
    data-page="genres"
  >

    <b>◈</b>

    Genres

  </button>


  <button
    class="navbtn"
    data-page="favorites"
  >

    <b>♥</b>

    Favorites

  </button>


  <button
    class="navbtn"
    data-page="watchlist"
  >

    <b>♡</b>

    Watchlist

  </button>

</nav>

</div>


<!-- =========================
     MOVIE DETAILS MODAL
========================= -->

<div
  class="modal"
  id="modal"
>

  <div class="sheet">

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <div id="detail"></div>

  </div>

</div>


<script>

/* =====================================================
   MOVIEHUB
   COMPLETE JAVASCRIPT
===================================================== */


/* =========================
   API
========================= */

const API =
  "https://moviehub-api.imessad-lyndadcot.workers.dev";


/* =========================
   APP DATA
========================= */

let movies = [];

let trending = [];
let popular = [];
let topRated = [];
let nowPlaying = [];
let upcoming = [];


/* =========================
   FAVORITES
========================= */

let favorites =
  JSON.parse(
    localStorage.getItem(
      "moviehub_favorites"
    ) || "[]"
  );


/* =========================
   WATCHLIST
========================= */

let watchlist =
  JSON.parse(
    localStorage.getItem(
      "moviehub_watchlist"
    ) || "[]"
  );


/* =========================
   SELECTOR
========================= */

function $(selector) {

  return document.querySelector(selector);

}


/* =========================
   POSTER URL
========================= */

function imageUrl(path) {

  if (!path) {

    return "https://via.placeholder.com/500x750?text=No+Poster";

  }

  if (path.startsWith("http")) {

    return path;

  }

  return "https://image.tmdb.org/t/p/w500" + path;

}


/* =========================
   NORMALIZE MOVIE
========================= */

function normalizeMovie(movie) {

  return {

    id: movie.id,

    t:
      movie.title ||
      movie.name ||
      "Untitled",

    img:
      imageUrl(
        movie.poster_path
      ),

    backdrop:
      imageUrl(
        movie.backdrop_path ||
        movie.poster_path
      ),

    r:
      movie.vote_average
        ? Number(movie.vote_average).toFixed(1)
        : "N/A",

    d:
      movie.overview ||
      "No description available.",

    release:
      movie.release_date ||
      "",

    g:
      "Movie"

  };

}


/* =========================
   UNIQUE MOVIES
========================= */

function uniqueMovies(list) {

  const seen = new Set();

  return list.filter(movie => {

    if (!movie || !movie.id) {

      return false;

    }

    if (seen.has(movie.id)) {

      return false;

    }

    seen.add(movie.id);

    return true;

  });

}


/* =========================
   FETCH MOVIES
========================= */

async function getMovies(endpoint) {

  try {

    const response =
      await fetch(
        API + endpoint
      );

    if (!response.ok) {

      throw new Error(
        "API error " +
        response.status
      );

    }

    const data =
      await response.json();

    return (
      data.results || []
    ).map(
      normalizeMovie
    );

  }

  catch (error) {

    console.error(
      "MovieHub API error:",
      endpoint,
      error
    );

    return [];

  }

}


/* =========================
   HEART BUTTON
========================= */

function heartButton(id) {

  const active =
    favorites.includes(id);

  return `

    <button
      class="heart ${active ? "active" : ""}"
      onclick="
        event.stopPropagation();
        toggleFavorite(${id});
      "
      title="Favorite"
    >
      ${active ? "♥" : "♡"}
    </button>

  `;

}


/* =========================
   MOVIE CARD
========================= */

function card(movie) {

  return `

    <div
      class="card"
      onclick="openMovie(${movie.id})"
    >

      ${heartButton(movie.id)}

      <img
        class="poster"
        src="${movie.img}"
        alt="${movie.t}"
        loading="lazy"
      >

      <div class="title">
        ${movie.t}
      </div>

      <div class="rating">
        ⭐ ${movie.r}
      </div>

    </div>

  `;

}


/* =========================
   MOVIE SECTION
========================= */

function movieSection(
  title,
  list
) {

  if (
    !list ||
    !list.length
  ) {

    return "";

  }

  return `

    <section>

      <div class="section-head">

        <h2>
          ${title}
        </h2>

      </div>

      <div class="row">

        ${list
          .map(card)
          .join("")}

      </div>

    </section>

  `;

}


/* =====================================================
   HOME
===================================================== */

function renderHome() {

  if (!movies.length) {

    $("#content").innerHTML = `

      <div class="empty">
        No movies available.
      </div>

    `;

    return;

  }


  const hero =
    trending[0] ||
    popular[0] ||
    movies[0];


  $("#content").innerHTML = `

    <div
      class="hero"
      style="
        background-image:
        url('${hero.backdrop}');
      "
      onclick="openMovie(${hero.id})"
    >

      <div class="hero-content">

        <div class="meta">

          ⭐ ${hero.r}

        </div>


        <h1>

          ${hero.t}

        </h1>


        <div class="meta">

          ${hero.release || "Movie"}

        </div>


        <p class="description">

          ${hero.d}

        </p>


        <div class="actions">

          <button
            class="btn primary"
            onclick="
              event.stopPropagation();
              openMovie(${hero.id});
            "
          >

            ▶ Details

          </button>


          <button
            class="btn favorite-btn"
            onclick="
              event.stopPropagation();
              toggleFavorite(${hero.id});
            "
          >

            ${
              favorites.includes(hero.id)
                ? "♥ Favorited"
                : "♡ Favorite"
            }

          </button>

        </div>

      </div>

    </div>


    ${movieSection(
      "🔥 Trending Now",
      trending
    )}


    ${movieSection(
      "⭐ Popular Movies",
      popular
    )}


    ${movieSection(
      "🏆 Top Rated",
      topRated
    )}


    ${movieSection(
      "🎬 Now Playing",
      nowPlaying
    )}


    ${movieSection(
      "🔜 Coming Soon",
      upcoming
    )}

  `;

}


/* =====================================================
   FAVORITES
===================================================== */

function toggleFavorite(id) {

  if (
    favorites.includes(id)
  ) {

    favorites =
      favorites.filter(
        movieId =>
          movieId !== id
      );

  }

  else {

    favorites.push(id);

  }


  localStorage.setItem(
    "moviehub_favorites",
    JSON.stringify(favorites)
  );


  const activePage =
    document
      .querySelector(
        ".navbtn.active"
      )
      ?.dataset.page;


  if (
    activePage ===
    "favorites"
  ) {

    renderFavorites();

  }

  else {

    renderHome();

  }

}


/* =========================
   FAVORITES PAGE
========================= */

function renderFavorites() {

  const list =
    movies.filter(movie =>
      favorites.includes(
        movie.id
      )
    );


  $("#content").innerHTML = `

    <section>

      <div class="section-head">

        <h2>
          ❤️ My Favorites
        </h2>

      </div>


      ${
        list.length

          ? `

            <div class="grid">

              ${list
                .map(card)
                .join("")}

            </div>

          `

          : `

            <div class="empty">

              <div style="font-size:45px">
                ♡
              </div>

              <br>

              You don't have any
              favorite movies yet.

              <br><br>

              Tap the ❤️ on a movie
              to add it here.

            </div>

          `
      }

    </section>

  `;

}


/* =====================================================
   WATCHLIST
===================================================== */

function toggleWatchlist(id) {

  if (
    watchlist.includes(id)
  ) {

    watchlist =
      watchlist.filter(
        movieId =>
          movieId !== id
      );

  }

  else {

    watchlist.push(id);

  }


  localStorage.setItem(
    "moviehub_watchlist",
    JSON.stringify(watchlist)
  );


  openMovie(id);

}


/* =========================
   WATCHLIST PAGE
========================= */

function renderWatchlist() {

  const list =
    movies.filter(movie =>
      watchlist.includes(
        movie.id
      )
    );


  $("#content").innerHTML = `

    <section>

      <div class="section-head">

        <h2>
          📌 My Watchlist
        </h2>

      </div>


      ${
        list.length

          ? `

            <div class="grid">

              ${list
                .map(card)
                .join("")}

            </div>

          `

          : `

            <div class="empty">

              <div style="font-size:45px">
                ♡
              </div>

              <br>

              Your watchlist is empty.

              <br><br>

              Add movies you want
              to watch later.

            </div>

          `
      }

    </section>

  `;

}


/* =====================================================
   MOVIE DETAILS
===================================================== */

function openMovie(id) {

  const movie =
    movies.find(
      item =>
        item.id === id
    );


  if (!movie) {

    console.log(
      "Movie not found:",
      id
    );

    return;

  }


  const isFavorite =
    favorites.includes(
      movie.id
    );


  const isWatchlisted =
    watchlist.includes(
      movie.id
    );


  $("#detail").innerHTML = `

    <img
      class="detailposter"
      src="${movie.img}"
      alt="${movie.t}"
    >


    <div class="detail">

      <h2>
        ${movie.t}
      </h2>


      <p>

        ⭐ ${movie.r}

        ${
          movie.release
            ? " · " +
              movie.release
            : ""
        }

      </p>


      <p>

        ${movie.d}

      </p>

<div class="detail-actions">

  <button
    class="btn primary"
    onclick="
      watchTrailer(${movie.id});
    "
  >

    ▶ Watch Trailer

  </button>


  <button
    class="btn primary"
    onclick="
      toggleFavorite(${movie.id});
    "
  >
      

          ${
            isFavorite
              ? "♥ Remove Favorite"
              : "♡ Add Favorite"
          }

        </button>


        <button
          class="btn secondary"
          onclick="
            toggleWatchlist(${movie.id});
          "
        >

          ${
            isWatchlisted
              ? "✓ Remove Watchlist"
              : "＋ Watchlist"
          }

        </button>

      </div>


      <div class="clear"></div>

    </div>

  `;


  $("#modal")
    .classList
    .add("open");

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

  $("#modal")
    .classList
    .remove("open");

  $("#detail").innerHTML = "";

}


/* =====================================================
   SEARCH
===================================================== */

function renderSearch() {

  $("#content").innerHTML = `

    <section>

      <div class="section-head">

        <h2>
          🔎 Search Movies
        </h2>

      </div>


      <div class="searchbox">

        <span>
          ⌕
        </span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search movies..."
          autocomplete="off"
        >

      </div>


      <div id="searchResults">

        <div class="empty">

          Search for a movie
          and press Enter.

        </div>

      </div>

    </section>

  `;


  const input =
    $("#searchInput");


  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        searchMovies(
          input.value.trim()
        );

      }

    }
  );


  input.focus();

}


/* =========================
   SEARCH API
========================= */

async function searchMovies(
  query
) {

  const resultsBox =
    $("#searchResults");


  if (!query) {

    resultsBox.innerHTML = `

      <div class="empty">

        Enter a movie name.

      </div>

    `;

    return;

  }


  resultsBox.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Searching...

    </div>

  `;


  try {

    const response =
      await fetch(
        API +
        "/search?q=" +
        encodeURIComponent(
          query
        )
      );


    if (!response.ok) {

      throw new Error(
        "Search failed"
      );

    }


    const data =
      await response.json();


    const results =
      uniqueMovies(
        (
          data.results ||
          []
        ).map(
          normalizeMovie
        )
      );


    if (!results.length) {

      resultsBox.innerHTML = `

        <div class="empty">

          No movies found for:

          <br><br>

          <strong>
            "${query}"
          </strong>

        </div>

      `;

      return;

    }


    /*
      Add search results to
      the main movie collection
      so their details/favorites
      work correctly.
    */

    movies =
      uniqueMovies([
        ...movies,
        ...results
      ]);


    resultsBox.innerHTML = `

      <div class="grid">

        ${results
          .map(card)
          .join("")}

      </div>

    `;

  }

  catch (error) {

    console.error(
      error
    );


    resultsBox.innerHTML = `

      <div class="empty">

        Search failed.

        <br><br>

        Please try again.

      </div>

    `;

  }

}

/* =========================
   WATCH TRAILER IN MOVIEHUB
========================= */

async function watchTrailer(id) {

  // Remove an existing trailer first
  const oldTrailer = document.getElementById("trailerBox");

  if (oldTrailer) {
    oldTrailer.remove();
  }

  try {

    const response = await fetch(
      API + "/movie/" + id + "/videos"
    );

    if (!response.ok) {
      throw new Error("Trailer request failed");
    }

    const data = await response.json();

    const videos = data.results || [];

    let trailer = videos.find(video =>
      video.site === "YouTube" &&
      video.type === "Trailer" &&
      video.official === true
    );

    if (!trailer) {
      trailer = videos.find(video =>
        video.site === "YouTube" &&
        video.type === "Trailer"
      );
    }

    if (!trailer) {
      trailer = videos.find(video =>
        video.site === "YouTube"
      );
    }

    if (!trailer) {
      alert(
        "Sorry, no trailer is available for this movie."
      );
      return;
    }

    const trailerUrl =
      "https://www.youtube.com/embed/" +
      trailer.key +
      "?autoplay=1";

    $("#detail").insertAdjacentHTML(
      "beforeend",
      `

      <div
        id="trailerBox"
        style="
          margin-top:25px;
          width:100%;
        "
      >

        <button
          class="btn secondary"
          onclick="closeTrailer()"
          style="
            margin-bottom:10px;
          "
        >
          ✕ Close Trailer
        </button>

        <div
          style="
            width:100%;
            aspect-ratio:16/9;
          "
        >

          <iframe
            width="100%"
            height="100%"
            src="${trailerUrl}"
            title="Movie Trailer"
            frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
          ></iframe>

        </div>

      </div>

      `
    );

  }

  catch (error) {

    console.error(
      "Trailer error:",
      error
    );

    alert(
      "Could not load the trailer. Please try again."
    );

  }

}
